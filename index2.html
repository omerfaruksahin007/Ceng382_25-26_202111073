<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom and Jerry Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: url('https://media1.tenor.com/m/JFk7Yk1y8iYAAAAC/tom-and-jerry-friends.gif') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Logo butonu */
        .logo {
            background: url('file:///C:/Users/MSI-NB/OneDrive/Masaüstü/svg/jerry.png') no-repeat center center;
            background-size: contain;
            width: 200px;
            height: 200px;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            margin: 10px;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        /* Login ekranı başlangıçta gizli */
        .login-container {
            display: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-button {
            background: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .login-button:hover {
            background: darkorange;
        }

        /* Saat için stil */
        #clock {
            font-size: 24px;
            color: white;
            margin-top: 10px;
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>

    <button class="logo" onclick="showLogin()"></button>

    <div class="login-container" id="loginBox">
        <h2>Tom and Jerry Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="login-button" onclick="login()">Login</button>
    </div>

    <div id="clock"></div>

    <script>
        // Show the login form
        function showLogin() {
            document.getElementById('loginBox').style.display = 'block';
        }

        // Array to store login credentials
        var loginData = [];

        // Login function to handle login attempts
        function login() {
            // Get the username and password entered by the user
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Store the username and password in the array
            loginData.push({ username: username, password: password });

            // Print all elements of the loginData array to the console
            console.log("All stored login credentials: ", loginData);

            // Optionally clear the form fields after login
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Function to toggle the visibility of the login form
        var formsVisible = true;

        function toggleForms() {
            var loginBox = document.getElementById('loginBox');
            if (formsVisible) {
                loginBox.style.display = 'none'; // Hide the login form
            } else {
                loginBox.style.display = 'block'; // Show the login form
            }
            formsVisible = !formsVisible; // Toggle the visibility state
        }

        // Event listener for 'H' key press to toggle visibility
        document.addEventListener('keydown', function(event) {
            if (event.key === 'h' || event.key === 'H') {
                toggleForms(); // Toggle the visibility of the login form
            }
        });

        // Canlı saat fonksiyonu
        function updateClock() {
            var now = new Date();
            var hours = now.getHours().toString().padStart(2, '0');
            var minutes = now.getMinutes().toString().padStart(2, '0');
            var seconds = now.getSeconds().toString().padStart(2, '0');
            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').textContent = timeString;
        }

        // Saati her saniye güncelle
        setInterval(updateClock, 1000);

        // Sayfa yüklendiğinde saati başlat
        updateClock();
    </script>

</body>
</html>
