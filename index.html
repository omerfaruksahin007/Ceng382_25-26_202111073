<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom and Jerry Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            /* Arka planda Tom and Jerry gif'i */
            background: url('https://media1.tenor.com/m/JFk7Yk1y8iYAAAAC/tom-and-jerry-friends.gif') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Logo butonu */
        .logo {
            background: url('file:///C:/Users/MSI-NB/OneDrive/Masaüstü/svg/jerry.png') no-repeat center center;
            background-size: contain;
            width: 200px;
            height: 200px;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            margin: 10px;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        /* Login ekranı başlangıçta gizli */
        .login-container {
            display: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-button {
            background: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .login-button:hover {
            background: darkorange;
        }
    </style>
</head>
<body>

    <!-- Logo Buton -->
    <button class="logo" onclick="showLogin()"></button>

    <!-- Login Ekranı -->
    <div class="login-container" id="loginBox">
        <h2>Tom and Jerry Login</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button class="login-button">Login</button>
    </div>

    <script>
        function showLogin() {
            document.getElementById('loginBox').style.display = 'block';
        }
    </script>

</body>
</html>
